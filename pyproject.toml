[project]
name = "meet-board"
version = "0.2.0"
description = "CTS (Colorado Time Systems) scoreboard overlay and spectator meet board"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "flask-login",
    "flask-socketio",
    "pyserial",
    "hytek-parser",
    "transitions",
]

[project.scripts]
meet-board = "CTS_Scoreboard:main"
cts-scoreboard = "CTS_Scoreboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "CTS_Scoreboard.py",
    "ap.py",
    "hytek_event_loader.py",
    "hytek_rec_parser.py",
    "hytek_st2_parser.py",
    "race_state_machine.py",
    "app_paths.py",
    "scb_loader.py",
    "meet_board.py",
    "updater.py",
    "_version.py",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
