name: Build Windows exe

# Every push to main builds meet-board.exe and publishes it as a GitHub
# Release. The timing PC's Software Update page installs the newest release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Stamp version
        id: ver
        shell: bash
        run: |
          VERSION="0.2.${{ github.run_number }}"
          echo "__version__ = \"$VERSION\"" > _version.py
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build exe
        run: uv run pyinstaller --noconfirm meet-board.spec

      - name: Smoke test
        shell: pwsh
        run: |
          $v = & .\dist\meet-board.exe --version
          Write-Host "Built $v"
          if ($v -ne "${{ steps.ver.outputs.version }}") { throw "version mismatch: $v" }

      - uses: actions/upload-artifact@v4
        with:
          name: meet-board-${{ steps.ver.outputs.version }}
          path: dist/meet-board.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: meet-board ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ github.event.head_commit.message }}

            Install: download meet-board.exe into a folder like C:\MeetBoard and run it.
            Update: Settings > Software Update on the timing PC.
          files: dist/meet-board.exe
          make_latest: true
