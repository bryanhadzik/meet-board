<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race overlay</title>
<!--
  OBS Browser Source overlay for the stream (1920x1080 canvas, transparent).
  OBS: Sources > + > Browser
       URL     http://localhost:5000/overlay/race
       Width 1920, Height 1080, leave "Custom CSS" as-is (background is transparent).

  What it shows follows the console:
    on the blocks  -> start list (lane, swimmer, team, seed)
    racing         -> running clock; each lane's time and place appear as they touch
    finished       -> results, sorted by place, top three marked
    blank          -> fades out

  URL options (combine with &):
    layout=panel|strip|tiers|race
                       panel (default) corner panel, as before
                       strip  full-width bottom band, one row of 8 lanes
                       tiers  full-width bottom band, 4+4 with lanes 5-8 on top
                              (matches the water: lane 8 is the far side)
                       race   like tiers, but the running clock becomes a hero
                              clock on the left while the race is on
    bandh=NNN          band height in 1080p px (strip 284, tiers/race 392)
    guide              draw the band outline + the OBS transform numbers
    pos=bl|br|tl|tr    corner, panel layout only (default bl = bottom-left)
    scale=1.0          size multiplier, e.g. 0.85 or 1.2
    running=list|clock during the race show the lane list (default) or only the clock bar
    results=place|lane order of the results (default place)
    test               show a pool photo behind it for positioning (never in OBS)
  e.g.  /overlay/race?pos=br&scale=0.9
        /overlay/race?layout=tiers
        /overlay/race?layout=race&guide     (to set the OBS crop, then drop &guide)

  The band layouts expect the camera source to be pushed up in OBS so the
  ceiling leaves the top of the canvas: scale the source to 1920 x (1080-bandh)
  and anchor it to the bottom. ?guide prints the exact numbers on screen.
-->
<style>
  :root { --u: calc(100vw / 1920); --scale: 1; --s: calc(var(--u) * var(--scale)); }
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden; background:transparent; }
  body.test { background:#1a3d52 url("{{ url_for('static', filename='pool.jpg') }}") center/cover no-repeat; }
  * { box-sizing:border-box; }

  .ov { position:absolute; width:calc(760 * var(--s)); font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif; color:#fff;
        transition:opacity .45s ease, transform .45s ease; }
  .pos-bl { left:calc(48 * var(--u)); bottom:calc(48 * var(--u)); }
  .pos-br { right:calc(48 * var(--u)); bottom:calc(48 * var(--u)); }
  .pos-tl { left:calc(48 * var(--u)); top:calc(48 * var(--u)); }
  .pos-tr { right:calc(48 * var(--u)); top:calc(48 * var(--u)); }
  .ov.off { opacity:0; transform:translateY(calc(24 * var(--s))); }
  .mono { font-family:Consolas, "Cascadia Mono", "DejaVu Sans Mono", "Courier New", monospace; }

  /* header bar: event | name ... heat | clock */
  .hdr { display:flex; align-items:stretch; height:calc(64 * var(--s)); border-radius:calc(10 * var(--s)) calc(10 * var(--s)) 0 0; overflow:hidden;
         box-shadow:0 calc(6 * var(--s)) calc(24 * var(--s)) rgba(0,0,0,.35); }
  .compact .hdr { border-radius:calc(10 * var(--s)); }
  .evbox { background:#0a6b7c; display:flex; flex-direction:column; justify-content:center; padding:0 calc(16 * var(--s)); min-width:0; flex:1; }
  .evno { font-size:calc(15 * var(--s)); font-weight:700; letter-spacing:.14em; color:#bfe6ec; line-height:1.1; }
  .evname { font-size:calc(24 * var(--s)); font-weight:700; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .heat { background:#08525f; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 calc(14 * var(--s)); }
  .heat .k { font-size:calc(12 * var(--s)); letter-spacing:.16em; color:#9fd4dc; }
  .heat .v { font-size:calc(24 * var(--s)); font-weight:700; line-height:1.1; }
  .clock { background:#0b1618; display:flex; align-items:center; justify-content:flex-end; width:calc(170 * var(--s)); padding:0 calc(16 * var(--s));
           font-size:calc(36 * var(--s)); font-weight:600; font-variant-numeric:tabular-nums; }
  .state { position:absolute; right:0; top:calc(-26 * var(--s)); font-size:calc(13 * var(--s)); letter-spacing:.18em; font-weight:700;
           background:#d9a441; color:#1b1405; padding:calc(4 * var(--s)) calc(10 * var(--s)); border-radius:calc(6 * var(--s)) calc(6 * var(--s)) 0 0; }
  .state:empty { display:none; }

  /* lane rows */
  .rows { background:rgba(11,22,24,.88); border-radius:0 0 calc(10 * var(--s)) calc(10 * var(--s)); overflow:hidden;
          box-shadow:0 calc(6 * var(--s)) calc(24 * var(--s)) rgba(0,0,0,.35); }
  .compact .rows { display:none; }
  .row { display:flex; align-items:center; height:calc(44 * var(--s)); gap:calc(12 * var(--s)); padding-right:calc(14 * var(--s));
         border-top:1px solid rgba(255,255,255,.06); transition:background .3s; }
  .row:first-child { border-top:0; }
  .stripe { width:calc(8 * var(--s)); align-self:stretch; background:var(--tc, transparent); flex:0 0 auto; }
  .ln { width:calc(30 * var(--s)); text-align:center; font-size:calc(21 * var(--s)); font-weight:700; color:#8fb0b7; flex:0 0 auto; }
  .nm { flex:1; min-width:0; font-size:calc(23 * var(--s)); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm { flex:0 0 auto; min-width:calc(68 * var(--s)); text-align:center; font-size:calc(14 * var(--s)); font-weight:700; letter-spacing:.06em;
        background:var(--tc, #3a4d52); color:var(--ink, #fff); border-radius:calc(5 * var(--s)); padding:calc(3 * var(--s)) calc(6 * var(--s)); }
  .tm:empty { visibility:hidden; }
  .t { flex:0 0 auto; width:calc(118 * var(--s)); text-align:right; font-size:calc(24 * var(--s)); font-variant-numeric:tabular-nums; color:#e8f1f2; }
  .t.seed { color:#7fe0ab; font-size:calc(19 * var(--s)); }
  .logo { flex:0 0 auto; width:calc(34 * var(--s)); height:calc(34 * var(--s)); background:#fff; border-radius:calc(6 * var(--s));
          padding:calc(2 * var(--s)); box-sizing:border-box; display:flex; align-items:center; justify-content:center;
          box-shadow:0 0 0 calc(1.5 * var(--s)) var(--tc, transparent); }
  .logo img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .logo.none { visibility:hidden; }
  .drop { flex:0 0 auto; min-width:calc(62 * var(--s)); text-align:right; font-size:calc(17 * var(--s)); font-weight:800;
          color:#7fe0ab; font-variant-numeric:tabular-nums; }
  .drop:empty { visibility:hidden; }
  .pl { flex:0 0 auto; width:calc(34 * var(--s)); height:calc(30 * var(--s)); display:flex; align-items:center; justify-content:center;
        font-size:calc(19 * var(--s)); font-weight:800; border-radius:calc(6 * var(--s)); color:#cfe0e3; }
  .pl:empty { visibility:hidden; }
  .row.p1 .pl { background:#e8c14a; color:#2a1f00; }
  .row.p2 .pl { background:#c9d2d6; color:#1d2427; }
  .row.p3 .pl { background:#c98a4f; color:#2a1604; }
  .row.p1 { background:rgba(232,193,74,.14); }
  .row.fresh { background:rgba(127,224,171,.30); }   /* just touched the wall */
  /* relays (panel): team + letter, the four legs' last names underneath */
  .row.relay { height:auto; min-height:calc(44 * var(--s)); padding-top:calc(4 * var(--s)); padding-bottom:calc(4 * var(--s)); }
  .row.relay .nm .rn { display:block; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
  .row.relay .legs { display:block; font-size:calc(16 * var(--s)); font-weight:500; color:#c9d6d9; line-height:1.2;
                     white-space:normal; }
  .row.relay .t.seed:empty { visibility:hidden; }

  /* ===================================================================
     Band layouts (strip / tiers / race)

     The panel layout above is untouched. Band layouts turn .ov into a
     full-width bar pinned to the bottom, and .rows into a grid of cells.
     .meta and .nums are display:contents in panel, so the panel row stays a
     single flat flex line exactly as before.
     =================================================================== */
  .ov .meta, .ov .nums { display:contents; }

  .ov.band { left:0; right:0; bottom:0; top:auto; width:100vw;
             height:calc(var(--bandh) * var(--u)); display:grid;
             grid-template-columns:1fr; grid-template-rows:auto 1fr;
             background:#091113; box-shadow:none; }
  .ov.band::before { content:""; position:absolute; left:0; right:0; top:calc(-5 * var(--u));
                     height:calc(5 * var(--u)); background:#3ddc84; }
  .ov.band.off { transform:translateY(calc(40 * var(--u))); }
  .ov.band .state { right:calc(44 * var(--u)); top:calc(-34 * var(--u));
                    border-radius:calc(6 * var(--u)) calc(6 * var(--u)) 0 0; }

  .ov.band .hdr { height:auto; border-radius:0; box-shadow:none; background:transparent;
                  align-items:center; padding:calc(18 * var(--s)) calc(44 * var(--u)) 0; gap:calc(18 * var(--s)); }
  .ov.band .evbox { background:transparent; padding:0; }
  .ov.band .evno { font-size:calc(22 * var(--s)); color:#3ddc84; letter-spacing:.16em; }
  .ov.band .evname { font-size:calc(36 * var(--s)); }
  .ov.band .heat { background:transparent; }
  .ov.band .heat .k { font-size:calc(14 * var(--s)); }
  .ov.band .heat .v { font-size:calc(30 * var(--s)); }
  .ov.band .clock { background:transparent; width:auto; color:#ffd60a; font-size:calc(52 * var(--s)); }

  .ov.band .rows { background:transparent; border-radius:0; box-shadow:none;
                   display:grid; align-content:start; overflow:visible;
                   padding:calc(10 * var(--s)) calc(32 * var(--u)) 0; column-gap:0; }
  .ov.band .row { height:auto; border-top:0; min-width:0; padding:calc(6 * var(--s)) calc(12 * var(--u));
                  display:grid; align-items:center; gap:0 calc(12 * var(--s));
                  grid-template-columns:auto 1fr; grid-template-areas:"ln meta" "ln nums"; }
  .ov.band .ln   { grid-area:ln; }
  .ov.band .meta { grid-area:meta; }
  .ov.band .nums { grid-area:nums; justify-content:flex-start; }
  /* the school logo gets its own column next to the lane badge; sharing the
     lane's grid area put it on top of the lane number */
  .ov.band .logo { grid-area:logo; }
  .ov.band .row.haslogo { grid-template-columns:auto auto 1fr; grid-template-areas:"ln logo meta" "ln logo nums"; }
  .ov.band .row + .row { border-top:0; }
  .ov.band .stripe { display:none; }
  .ov.band .meta { display:block; min-width:0; }
  .ov.band .nums { display:flex; align-items:center; gap:calc(10 * var(--s)); min-width:0; overflow:hidden; }
  .ov.band .nums .t, .ov.band .nums .tm { flex:0 0 auto; }

  /* lane number becomes a team-coloured badge, which is what makes the strip
     scannable from the stands */
  .ov.band .ln { width:auto; min-width:calc(46 * var(--s)); height:calc(46 * var(--s));
                 display:flex; align-items:center; justify-content:center;
                 background:var(--tc, #2a3b40); color:var(--ink, #fff);
                 border-radius:calc(12 * var(--s)); font-size:calc(28 * var(--s)); font-weight:800; }
  .ov.band .nm { font-size:calc(34 * var(--s)); font-weight:700; }
  .ov.band .tm { min-width:0; font-size:calc(16 * var(--s)); border-radius:calc(999 * var(--s));
                 padding:calc(2 * var(--s)) calc(9 * var(--s)); display:inline-block; }
  .ov.band .t { width:auto; font-size:calc(28 * var(--s)); }
  .ov.band .t.seed { font-size:calc(26 * var(--s)); color:#9fb3b8; }
  .ov.band .drop { min-width:0; font-size:calc(18 * var(--s)); }
  .ov.band .pl { width:calc(38 * var(--s)); height:calc(34 * var(--s)); font-size:calc(22 * var(--s)); }
  .ov.band .logo { width:calc(38 * var(--s)); height:calc(38 * var(--s)); }

  /* relays in a band: relay name, then the four legs, then time/place. The
     relay name already says the team, so the code badge is dropped, and the
     seed is what gives way. Names and legs shrink to fit rather than clip. */
  .ov.band .row.relay { grid-template-columns:auto 1fr; grid-template-areas:"ln meta" "ln legs" "ln nums"; row-gap:calc(1 * var(--s)); }
  .ov.band .row.relay.haslogo { grid-template-columns:auto auto 1fr; grid-template-areas:"ln logo meta" "ln logo legs" "ln logo nums"; }
  .ov.band .row.relay .legs { grid-area:legs; min-width:0; font-size:calc(20 * var(--s)); font-weight:500; color:#c9d6d9;
                              line-height:1.15; white-space:nowrap; overflow:hidden; }
  .ov.band .row.relay .legs.wrap { white-space:normal; }
  .ov.band .row.relay .nm { font-size:calc(28 * var(--s)); line-height:1.1; text-overflow:clip; }
  .ov.band .row.relay .nums .tm { display:none; }
  .ov.band .row.relay .nums .t.seed { display:none; }
  .ov.band .row.relay .nums .drop:empty { display:none; }   /* else the time sits indented */
  .ov.band .row.relay .t { font-size:calc(24 * var(--s)); }
  .ov.band.relays .hdr { padding-top:calc(10 * var(--s)); }
  .ov.band.relays .rows { padding-top:calc(4 * var(--s)); }
  .ov.band.relays .row { padding-top:calc(4 * var(--s)); padding-bottom:calc(4 * var(--s)); }

  /* --- strip: one row of 8. Cells are ~240px wide at 1080p, so last names
         only and the team code shrinks before it can touch the time. --- */
  .ov.lay-strip .rows { grid-template-columns:repeat(8, minmax(0, 1fr)); }
  .ov.lay-strip .row { border-left:1px solid rgba(255,255,255,.08); }
  .ov.lay-strip .row.col1 { border-left:0; }
  .ov.lay-strip .ln { align-self:start; }
  .ov.lay-strip .nm { font-size:calc(25 * var(--s)); text-transform:uppercase; letter-spacing:.01em; }
  .ov.lay-strip .ln { min-width:calc(40 * var(--s)); height:calc(40 * var(--s)); font-size:calc(25 * var(--s)); }
  .ov.lay-strip .nums { gap:calc(5 * var(--s)); }
  /* the team code gives way before the time or place can be cut off */
  .ov.band .nums .tm { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:clip; white-space:nowrap; }
  .ov.band .nums .t, .ov.band .nums .pl, .ov.band .nums .drop { flex:0 0 auto; }
  /* where cells are tightest the school's logo already names the team, so drop
     the code rather than show it clipped */
  .ov.lay-strip .row.withlogo .nums .tm, .ov.lay-race.hero .row.withlogo .nums .tm { display:none; }
  .ov.lay-strip .tm { font-size:calc(13 * var(--s)); padding:calc(2 * var(--s)) calc(6 * var(--s)); }
  .ov.lay-strip .t  { font-size:calc(19 * var(--s)); }
  .ov.lay-strip .t.seed { font-size:calc(19 * var(--s)); }
  .ov.lay-strip .drop { display:none; }   /* no room; the tier layouts keep it */
  .ov.lay-strip .pl { width:calc(26 * var(--s)); height:calc(24 * var(--s)); font-size:calc(16 * var(--s)); }
  .ov.lay-strip .row { padding-left:calc(10 * var(--u)); padding-right:calc(10 * var(--u)); gap:0 calc(9 * var(--s)); }
  /* strip cells are too narrow for a logo column: stack it under the lane number */
  .ov.lay-strip .row.haslogo { grid-template-columns:auto 1fr; grid-template-areas:"ln meta" "logo nums"; row-gap:calc(4 * var(--s)); }
  .ov.lay-strip .logo { width:calc(40 * var(--s)); height:calc(40 * var(--s)); }

  .ov.lay-strip .row.relay.haslogo { grid-template-columns:auto 1fr; grid-template-areas:"ln meta" "logo legs" "logo nums"; }
  .ov.lay-strip .row.relay .nm { font-size:calc(21 * var(--s)); }
  .ov.lay-strip .row.relay .legs { font-size:calc(15 * var(--s)); }
  .ov.lay-strip .row.relay .t { font-size:calc(19 * var(--s)); }
  .ov.lay-strip .row.relay .logo { width:calc(34 * var(--s)); height:calc(34 * var(--s)); }

  /* --- tiers / race: 4 across, 2 deep, lanes 5-8 on the top row --- */
  .ov.lay-tiers .rows, .ov.lay-race .rows { grid-template-columns:repeat(4, minmax(0, 1fr)); row-gap:calc(6 * var(--s)); }
  .ov.lay-tiers .row, .ov.lay-race .row { border-left:1px solid rgba(255,255,255,.08); }
  .ov.lay-tiers .row.col1, .ov.lay-race .row.col1 { border-left:0; }

  /* --- race: hero clock on the left while the race is running --- */
  .ov.lay-race.hero { grid-template-columns:calc(400 * var(--u)) 1fr; grid-template-rows:1fr;
                      grid-template-areas:"hdr rows"; }
  .ov.lay-race.hero .hdr  { grid-area:hdr; flex-direction:column; align-items:flex-start; justify-content:center;
                            padding:0 calc(36 * var(--u)); gap:calc(2 * var(--s)); }
  /* .evbox carries flex:1 for the horizontal header; in this column it would
     grow vertically and shove the clock onto the floor of the band. */
  .ov.lay-race.hero .evbox { flex:0 0 auto; width:100%; }
  /* The band height is fixed by the OBS crop, so it cannot grow for the race.
     Four columns x two rows it is - the same grid as tiers, just narrower,
     so the type steps down a size to keep every name whole. */
  .ov.lay-race.hero .rows { grid-area:rows; align-content:center; padding:0 calc(28 * var(--u));
                            grid-template-columns:repeat(4, minmax(0, 1fr)); row-gap:calc(4 * var(--s)); }
  .ov.lay-race.hero .clock { font-size:calc(76 * var(--s)); line-height:1.05; justify-content:flex-start; padding:0; }
  .ov.lay-race.hero .nm { font-size:calc(27 * var(--s)); }
  .ov.lay-race.hero .row.relay .legs { font-size:calc(17 * var(--s)); }
  .ov.lay-race.hero .row.relay .nm { font-size:calc(24 * var(--s)); }
  .ov.lay-race.hero .row.relay .t { font-size:calc(21 * var(--s)); }
  .ov.lay-race.hero .ln { min-width:calc(40 * var(--s)); height:calc(40 * var(--s)); font-size:calc(24 * var(--s)); }
  .ov.lay-race.hero .t  { font-size:calc(24 * var(--s)); }
  .ov.lay-race.hero .tm { font-size:calc(14 * var(--s)); }
  /* hero cells are the narrowest per lane: tighten so time and place stay whole */
  .ov.lay-race.hero .row { gap:0 calc(8 * var(--s)); }
  .ov.lay-race.hero .nums { gap:calc(6 * var(--s)); }
  .ov.lay-race.hero .logo { width:calc(32 * var(--s)); height:calc(32 * var(--s)); }
  .ov.lay-race.hero .evno { font-size:calc(19 * var(--s)); }
  .ov.lay-race.hero .evname { font-size:calc(26 * var(--s)); white-space:normal; }
  .ov.lay-race.hero .heat { flex-direction:row; gap:calc(8 * var(--s)); align-items:baseline; padding:0; }

  /* --- ?guide: a positioning aid, never left on for a real stream --- */
  .guide { position:fixed; inset:0; pointer-events:none; z-index:9; }
  .guide .vid { position:absolute; left:0; right:0; top:0; bottom:calc(var(--bandh) * var(--u));
                outline:calc(3 * var(--u)) dashed #3ddc84; outline-offset:calc(-3 * var(--u)); }
  .guide .chrome { position:absolute; left:0; right:0; bottom:0; height:calc(74 * var(--u));
                   background:repeating-linear-gradient(45deg,rgba(255,90,110,.22) 0 14px,transparent 14px 28px); }
  .guide .tip { position:absolute; left:calc(40 * var(--u)); top:calc(40 * var(--u));
                background:rgba(0,0,0,.82); color:#ffd60a; padding:calc(14 * var(--u)) calc(18 * var(--u));
                border-radius:calc(8 * var(--u)); font:600 calc(20 * var(--u))/1.5 Consolas, monospace;
                white-space:pre; }
</style>
</head>
<body class="{{ 'test' if test_background else '' }}">
<div class="ov off" id="ov">
  <div class="state mono" id="state"></div>
  <div class="hdr">
    <div class="evbox"><div class="evno mono" id="evno"></div><div class="evname" id="evname"></div></div>
    <div class="heat" id="heatbox"><div class="k mono">HEAT</div><div class="v mono" id="heat"></div></div>
    <div class="clock mono" id="clock"></div>
  </div>
  <div class="rows" id="rows"></div>
</div>
<div class="guide" id="guide" hidden><div class="vid"></div><div class="chrome"></div><div class="tip" id="tip"></div></div>

<script src="{{ url_for('static', filename='socket.io.4.8.3.min.js') }}"></script>
<script src="{{ url_for('static', filename='screen-reload.js') }}"></script>
<script>
(function(){
"use strict";
var q = new URLSearchParams(location.search);
var POS = ({bl:1, br:1, tl:1, tr:1})[q.get('pos')] ? q.get('pos') : 'bl';
var SCALE = Math.max(0.4, Math.min(2.5, parseFloat(q.get('scale')) || 1));
var RUNNING_MODE = q.get('running') === 'clock' ? 'clock' : 'list';
var SHOW_LOGOS = q.get('logos') !== '0';   // ?logos=0 hides school logos

var LAYOUT = ({panel:1, strip:1, tiers:1, race:1})[q.get('layout')] ? q.get('layout') : 'panel';
var BAND = LAYOUT !== 'panel';
var DEFAULT_BANDH = LAYOUT === 'strip' ? 284 : 392;   // clears the player controls
var BANDH = Math.max(140, Math.min(560, parseInt(q.get('bandh'), 10) || DEFAULT_BANDH));
// A band is a map of the pool, so the cells must stay in lane order or a
// parent loses the lane they were watching. Place order is still the default
// for the corner panel, and ?results=place can force it back.
var RESULTS_ORDER = q.get('results') ? (q.get('results') === 'lane' ? 'lane' : 'place')
                                     : (BAND ? 'lane' : 'place');

var ov = document.getElementById('ov');
document.documentElement.style.setProperty('--scale', SCALE);
if (BAND) {
  ov.classList.add('band', 'lay-' + LAYOUT);
  document.documentElement.style.setProperty('--bandh', BANDH);
} else {
  ov.classList.add('pos-' + POS);
}

if (q.has('guide') && BAND) {
  var g = document.getElementById('guide');
  g.hidden = false;
  document.getElementById('tip').textContent =
    'layout=' + LAYOUT + '  bandh=' + BANDH + '\n\n' +
    'OBS camera source transform:\n' +
    '  size      1920 x ' + (1080 - BANDH) + '\n' +
    '  position  0, 0   (anchor top-left)\n' +
    '  crop      take the BOTTOM ' + (1080 - BANDH) + '/1080 of the framing\n' +
    '            so the ceiling leaves the top and the deck stays\n\n' +
    'green dashes = video area    red hatch = player controls\n' +
    'remove &guide before you go live';
}

var s = {};
var lastTimes = {}, freshUntil = {};

function lin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
function inkOf(hex){
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return '#ffffff';
  var L = 0.2126*lin(parseInt(hex.slice(1,3),16)) + 0.7152*lin(parseInt(hex.slice(3,5),16)) + 0.0722*lin(parseInt(hex.slice(5,7),16));
  return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? '#0b1618' : '#ffffff';
}
function colorOf(team){
  var r = (s.resolved_colors || {})[team]; if (r) return r;
  var t = (s.team_colors || {})[team]; return t && t.color ? t.color : '';
}
function trim(v){ return (v == null ? '' : String(v)).trim(); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function fmtSeed(v){
  if (v === '' || v == null) return '';
  var t = Number(v); if (!isFinite(t) || t <= 0) return '';
  var m = Math.floor(t/60), sec = t - m*60;
  return m ? m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(2) : sec.toFixed(2);
}

function phase(){
  var st = s.race_state || '';
  if (st === 'Running') return 'running';
  if (st === 'Finished') return 'results';
  if (/PreRace$/.test(st)) return 'startlist';
  return 'off';   // Clear, Blank, TotalBlank, unknown
}

// "Beat the seed": finished time under the entry seed time -> seconds dropped
function secs(v){
  var m = String(v == null ? '' : v).trim().match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  return m ? (m[1] ? +m[1] * 60 : 0) + parseFloat(m[2]) : NaN;
}
function dropOf(time, seed){
  if (s.show_pr_tags === false) return '';
  var t = secs(time), sd = Number(seed);
  if (!(t > 0) || !(sd > 0) || t >= sd) return '';
  return '\u2212' + (sd - t).toFixed(2);
}
// "Stansbury C" -> "STAN C": used only when the full relay name can't fit its cell
function relayShort(l){
  var m = (l.name || '').match(/\s([A-Z])$/);
  return (l.team || l.name) + (m ? ' ' + m[1] : '');
}
// Band cells are fixed-width, so a long relay name ("North Summit A") or a
// long set of legs would be cut off. Shrink the type to fit instead; a name
// that still won't fit falls back to "CODE A", and legs wrap to a second line.
function shrinkToFit(e, minFrac){
  var size = parseFloat(getComputedStyle(e).fontSize), min = size * minFrac;
  while (e.scrollWidth > e.clientWidth + 1 && size > min){ size -= 1; e.style.fontSize = size + 'px'; }
  return e.scrollWidth <= e.clientWidth + 1;
}
function fitRelayNames(){
  var rows = document.querySelectorAll('.ov.band .row.relay');
  for (var i = 0; i < rows.length; i++){
    var nm = rows[i].querySelector('.nm'), lg = rows[i].querySelector('.legs');
    if (nm && !shrinkToFit(nm, 0.75) && nm.getAttribute('data-short')){
      nm.style.fontSize = ''; nm.textContent = nm.getAttribute('data-short'); shrinkToFit(nm, 0.75);
    }
    if (lg && !shrinkToFit(lg, 0.75)){ lg.style.fontSize = ''; lg.classList.add('wrap'); }
  }
}
function lanes(){
  var n = Math.max(parseInt(s.num_lanes, 10) || 8, 1), out = [];
  for (var i = 1; i <= 10; i++){
    var name = trim(s['lane_name'+i]), team = trim(s['lane_team'+i]);
    var running = !!s['lane_running'+i];
    var t = running ? '' : trim(s['lane_time'+i]);
    var place = trim(s['lane_place'+i]);
    if (i > n && !name && !t) continue;
    if (!name && !team && !t) continue;          // don't spend screen on empty lanes
    var legs = (s['lane_legs'+i] || []).map(trim).filter(Boolean);   // relay swimmers' last names
    out.push({lane:i, name:name, team:team, time:t, place:place, seed:s['lane_seed_time'+i], legs:legs});
  }
  return out;
}

var pending = false;
function render(){
  if (pending) return; pending = true;
  requestAnimationFrame(function(){ pending = false; draw(); });
}

var hideSince = 0, hideTimer = null, dropTimer = null;
function draw(){
  var ph = phase();
  var ev = trim(s.current_event), ht = trim(s.current_heat);
  var hasEvent = ev && ev !== '0';
  var L = lanes();
  // Empty lanes often never "finish" on the console, so the race can stay
  // Running after everyone has touched. Once every swimmer has a time, show results.
  if (ph === 'running'){
    var swimmers = L.filter(function(l){ return l.name || l.team; });
    if (swimmers.length && swimmers.every(function(l){ return l.time && l.place; })) ph = 'results';
  }
  var show = ph !== 'off' && hasEvent && (L.length > 0 || ph === 'running');
  // Only hide once "nothing to show" has lasted 1.5 s: a single odd update from
  // the console (or a re-sync) must not blink the whole overlay off and on.
  if (show) { hideSince = 0; ov.classList.remove('off'); }
  else {
    if (!hideSince) hideSince = Date.now();
    if (Date.now() - hideSince >= 1500) ov.classList.add('off');
    else { clearTimeout(hideTimer); hideTimer = setTimeout(render, 1600); return; }
  }

  document.getElementById('evno').textContent = hasEvent ? 'EVENT ' + ev : '';
  document.getElementById('evname').textContent = trim(s.event_name) || (hasEvent ? 'Event ' + ev : '');
  var hc = parseInt(s.heat_count, 10) || 0;
  document.getElementById('heat').textContent = ht ? ht + (hc ? '/' + hc : '') : '';
  document.getElementById('heatbox').style.display = ht ? '' : 'none';
  var clock = trim(s.running_time);
  document.getElementById('clock').textContent = ph === 'startlist' ? '' : clock;
  document.getElementById('clock').style.display = (ph === 'startlist' || !clock) ? 'none' : '';
  document.getElementById('state').textContent =
    ph === 'startlist' ? 'START LIST' : ph === 'results' ? 'RESULTS' : '';
  // 'compact' (clock bar only) is a panel idea - an empty band looks broken,
  // so the race layout answers ?running=clock with the hero clock instead.
  ov.classList.toggle('compact', !BAND && ph === 'running' && RUNNING_MODE === 'clock');
  ov.classList.toggle('hero', LAYOUT === 'race' && ph === 'running');
  ov.classList.toggle('relays', L.some(function(l){ return l.legs.length; }));

  if (ph === 'results' && RESULTS_ORDER === 'place'){
    L.sort(function(a, b){
      var pa = parseInt(a.place, 10) || 99, pb = parseInt(b.place, 10) || 99;
      return pa - pb || a.lane - b.lane;
    });
  }

  // Lane 1 is nearest the camera and lane 8 is the far side, so the top row of
  // the grid holds the high lanes: the strip reads the same way up as the water.
  var COLS = 1;
  if (LAYOUT === 'tiers' || LAYOUT === 'race'){
    COLS = 4;
    L.sort(function(a, b){
      var ga = a.lane > 4 ? 0 : 1, gb = b.lane > 4 ? 0 : 1;
      return ga - gb || a.lane - b.lane;
    });
  } else if (LAYOUT === 'strip'){
    COLS = 8;
    L.sort(function(a, b){ return a.lane - b.lane; });
  }

  var box = document.getElementById('rows'); box.textContent = '';
  L.forEach(function(l, idx){
    var r = el('div', 'row');
    if (BAND && idx % COLS === 0) r.classList.add('col1');
    var c = colorOf(l.team);
    if (c){ r.style.setProperty('--tc', c); r.style.setProperty('--ink', inkOf(c)); }
    var showResult = ph !== 'startlist' && l.time;
    if (showResult && /^[123]$/.test(l.place)) r.classList.add('p' + l.place);
    if (showResult && ph === 'running' && lastTimes[l.lane] !== undefined && lastTimes[l.lane] !== l.time)
      freshUntil[l.lane] = Date.now() + 2000;
    if (ph === 'running' && (freshUntil[l.lane] || 0) > Date.now()) r.classList.add('fresh');
    r.appendChild(el('div', 'stripe'));
    r.appendChild(el('div', 'ln mono', String(l.lane)));
    if (SHOW_LOGOS && s.team_logos && Object.keys(s.team_logos).length){
      var v = l.team ? s.team_logos[l.team] : null, lg = el('div', 'logo' + (v ? '' : ' none'));
      if (v){ var im = el('img'); im.alt = ''; im.src = '/team_logo/' + encodeURIComponent(l.team) + '?v=' + v; lg.appendChild(im); }
      r.appendChild(lg); r.classList.add('haslogo'); if (v) r.classList.add('withlogo');
    }
    // .meta and .nums are display:contents in the panel layout, so the panel
    // row is still one flat flex line; the band layouts use them as real boxes.
    var meta = el('div', 'meta'), nums = el('div', 'nums');
    // A 240px strip cell cannot hold "Adelia Schupbach" at a readable size, and
    // a surname is what a parent scans for anyway.
    var relay = l.legs.length > 0;
    var who = l.name || ('Lane ' + l.lane);
    // ("Stansbury C" is a relay team, not a surname - keep it whole)
    if (LAYOUT === 'strip' && !relay && who.indexOf(' ') > 0) who = who.split(/\s+/).pop();
    var nm = el('div', 'nm', who);
    meta.appendChild(nm);
    // Relays: the four swimmers' last names always show. The relay name already
    // says the team, and the seed is what gives way to make room.
    var legs = relay ? el('div', 'legs', l.legs.join(' \u00b7 ')) : null;
    if (relay){
      r.classList.add('relay');
      if (BAND){ r.appendChild(legs); nm.setAttribute('data-short', relayShort(l)); }  // legs: own grid row
      else { nm.textContent = ''; nm.appendChild(el('span', 'rn', who)); nm.appendChild(legs); }
    }
    // In a band the name owns its own line, so the team code sits with the time.
    (BAND ? nums : meta).appendChild(el('div', 'tm mono', l.team));
    if (ph === 'startlist') nums.appendChild(el('div', 't seed mono', relay ? '' : fmtSeed(l.seed)));
    else {
      nums.appendChild(el('div', 'drop mono', showResult ? dropOf(l.time, l.seed) : ''));
      nums.appendChild(el('div', 't mono', l.time));
    }
    r.appendChild(meta);
    r.appendChild(nums);
    var pl = el('div', 'pl mono', showResult ? l.place : '');
    (BAND ? nums : r).appendChild(pl);
    box.appendChild(r);
  });
  if (BAND) fitRelayNames();
  lastTimes = {};
  L.forEach(function(l){ lastTimes[l.lane] = l.time; });
}

var socket = io.connect(location.protocol + '//' + location.host + '/scoreboard');
    if (window.mbAutoReload) window.mbAutoReload(socket);
socket.on('update_scoreboard', function(u){ for (var k in u) s[k] = u[k]; render(); });
// Lost the server: keep the last picture for 5 s (a quick reconnect shouldn't flash)
socket.on('disconnect', function(){ clearTimeout(dropTimer); dropTimer = setTimeout(function(){ ov.classList.add('off'); }, 5000); });
socket.on('connect', function(){ clearTimeout(dropTimer); });
})();
</script>
</body>
</html>
