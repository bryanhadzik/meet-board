<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lane rail overlay</title>
<!--
  OBS Browser Source: who is in which lane, as a column of chips down the side
  of the picture, before the race starts. Disappears the moment the race starts
  and comes back for the next heat's start list.

  Add it as its own Browser source ABOVE the camera (and above /overlay/race):
       URL     http://localhost:5000/overlay/lanes
       Width 1920, Height 1080

  The chips sit in lane order like the water: lane 8 (far side) at the top,
  lane 1 (nearest the camera) at the bottom. Line them up with the blocks using
  top= and bottom=.

  URL options (combine with &):
    side=left|right    which edge (default left)
    top=NNN            y of the top of the rail in 1080p px (default 90)
    bottom=NNN         y of the bottom of the rail (default 772, just above a 284 px band)
    order=up|down      up (default): lane 1 at the bottom; down: lane 1 at the top
    width=NNN          chip width in px (default 330; 430 for relays with swimmers listed)
    scale=1.0          size multiplier for the type
    logos=0            hide school logos
    test               show a pool photo behind it for positioning (never in OBS)
    demo               always show (ignore the race state) - for lining it up
-->
<style>
  :root { --u: calc(100vw / 1920); --scale: 1; --s: calc(var(--u) * var(--scale)); }
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden; background:transparent; }
  body.test { background:#1a3d52 url("{{ url_for('static', filename='pool.jpg') }}") center/cover no-repeat; }
  * { box-sizing:border-box; }
  .rail { position:absolute; display:flex; flex-direction:column; justify-content:space-between;
          font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif; color:#fff;
          transition:opacity .35s ease, transform .35s ease; }
  .rail.left  { left:calc(14 * var(--u)); }
  .rail.right { right:calc(14 * var(--u)); }
  .rail.off { opacity:0; }
  .rail.left.off  { transform:translateX(calc(-40 * var(--u))); }
  .rail.right.off { transform:translateX(calc(40 * var(--u))); }
  .mono { font-family:Consolas, "Cascadia Mono", "DejaVu Sans Mono", "Courier New", monospace; }

  .chip { display:flex; align-items:center; gap:calc(10 * var(--s)); width:100%;
          background:rgba(9,17,19,.86); border-radius:calc(10 * var(--s)); overflow:hidden;
          box-shadow:0 calc(3 * var(--s)) calc(12 * var(--s)) rgba(0,0,0,.35); }
  .rail.right .chip { flex-direction:row-reverse; text-align:right; }
  .chip.empty { background:rgba(9,17,19,.45); }
  .ln { flex:0 0 auto; align-self:stretch; display:flex; align-items:center; justify-content:center;
        background:var(--tc, #2a3b40); color:var(--ink, #fff); font-weight:800; }
  .chip.empty .ln { background:rgba(42,59,64,.7); color:#9fb3b8; }
  .logo { flex:0 0 auto; background:#fff; border-radius:calc(6 * var(--s)); padding:calc(2 * var(--s));
          display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 calc(1.5 * var(--s)) var(--tc, transparent); }
  .logo img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .logo.none { visibility:hidden; }
  .txt { flex:1; min-width:0; padding-right:calc(10 * var(--s)); }
  .rail.right .txt { padding-right:0; padding-left:calc(10 * var(--s)); }
  .nm { font-weight:700; white-space:nowrap; overflow:hidden; line-height:1.1; }
  .sub { white-space:nowrap; overflow:hidden; line-height:1.15; color:#c9d6d9; font-weight:500; }
  .sub.code { color:var(--tc, #9fb3b8); font-weight:700; letter-spacing:.06em; }
  .sub.legs { white-space:normal; line-height:1.12; }
</style>
</head>
<body class="{{ 'test' if test_background else '' }}">
<div class="rail off" id="rail"></div>

<script src="{{ url_for('static', filename='socket.io.4.8.3.min.js') }}"></script>
<script src="{{ url_for('static', filename='screen-reload.js') }}"></script>
<script>
(function(){
"use strict";
var q = new URLSearchParams(location.search);
function num(k, d, lo, hi){ var v = parseFloat(q.get(k)); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; }
var SIDE = q.get('side') === 'right' ? 'right' : 'left';
var TOP = num('top', 90, 0, 1000), BOTTOM = num('bottom', 772, 80, 1080);
var WIDTH_SET = q.has('width');
var WIDTH = num('width', 330, 160, 700), SCALE = num('scale', 1, 0.5, 2.5);
var ORDER_DOWN = q.get('order') === 'down';
var SHOW_LOGOS = q.get('logos') !== '0';
var DEMO = q.has('demo');

var rail = document.getElementById('rail');
var U = window.innerWidth / 1920;
document.documentElement.style.setProperty('--scale', SCALE);
rail.classList.add(SIDE);
function place(w){
  U = window.innerWidth / 1920;
  rail.style.top = (TOP * U) + 'px';
  rail.style.height = (Math.max(40, BOTTOM - TOP) * U) + 'px';
  rail.style.width = ((w || WIDTH) * U) + 'px';
}
place(); window.addEventListener('resize', function(){ place(); render(); });

var s = {};
function trim(v){ return (v == null ? '' : String(v)).trim(); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function lin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
function inkOf(hex){
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return '#ffffff';
  var L = 0.2126*lin(parseInt(hex.slice(1,3),16)) + 0.7152*lin(parseInt(hex.slice(3,5),16)) + 0.0722*lin(parseInt(hex.slice(5,7),16));
  return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? '#0b1618' : '#ffffff';
}
function colorOf(team){
  var r = (s.resolved_colors || {})[team]; if (r) return r;
  var t = (s.team_colors || {})[team]; return t && t.color ? t.color : '';
}
// Only before the start: InPreRace / ClearPreRace / BlankPreRace ...
function onBlocks(){ return /PreRace$/.test(s.race_state || ''); }

// shrink type until it fits its box (never clip a name)
function fit(e, minFrac){
  var size = parseFloat(getComputedStyle(e).fontSize), min = size * minFrac;
  while (e.scrollWidth > e.clientWidth + 1 && size > min){ size -= 0.5; e.style.fontSize = size + 'px'; }
}

var pending = false;
function render(){ if (pending) return; pending = true; requestAnimationFrame(function(){ pending = false; draw(); }); }

var hideSince = 0, hideTimer = null;
function draw(){
  var ev = trim(s.current_event), hasEvent = ev && ev !== '0';
  var n = Math.max(1, Math.min(10, parseInt(s.num_lanes, 10) || 8));
  var anyone = false;
  for (var i = 1; i <= n; i++) if (trim(s['lane_name'+i]) || trim(s['lane_team'+i])) anyone = true;
  var show = DEMO || (onBlocks() && hasEvent && anyone);
  if (s.race_state === 'Running' && !DEMO){ hideSince = 0; rail.classList.add('off'); return; }  // the gun: gone at once
  if (show){ hideSince = 0; rail.classList.remove('off'); }
  else {
    // anything else (blank console, a one-off odd update): wait 1.5 s before hiding
    if (!hideSince) hideSince = Date.now();
    if (Date.now() - hideSince >= 1500) rail.classList.add('off');
    else { clearTimeout(hideTimer); hideTimer = setTimeout(render, 1600); }
    return;
  }

  // relays with swimmers listed get a wider rail (unless width= was given)
  var hasLegs = false;
  for (var j = 1; j <= n; j++) if ((s['lane_legs'+j] || []).some(function(x){ return trim(x); })) hasLegs = true;
  place(hasLegs && !WIDTH_SET ? 430 : WIDTH);
  rail.textContent = '';
  var slot = (BOTTOM - TOP) * U / n;               // px per lane
  var h = Math.min(slot * 0.86, 76 * U * SCALE);   // chip height
  var relayEvent = !!s.event_is_relay;
  var lanes = [];
  for (var k = 1; k <= n; k++) lanes.push(k);
  if (!ORDER_DOWN) lanes.reverse();                // lane 8 at the top, like the water
  lanes.forEach(function(lane){
    var name = trim(s['lane_name'+lane]), team = trim(s['lane_team'+lane]);
    var legs = (s['lane_legs'+lane] || []).map(trim).filter(Boolean);
    var chip = el('div', 'chip' + (name || team ? '' : ' empty'));
    chip.style.height = h + 'px';
    var c = colorOf(team);
    if (c){ chip.style.setProperty('--tc', c); chip.style.setProperty('--ink', inkOf(c)); }
    var ln = el('div', 'ln mono', String(lane));
    ln.style.width = h + 'px'; ln.style.fontSize = (h * 0.56) + 'px';
    chip.appendChild(ln);
    if (SHOW_LOGOS && s.team_logos && Object.keys(s.team_logos).length && (name || team)){
      var v = team ? s.team_logos[team] : null, lg = el('div', 'logo' + (v ? '' : ' none'));
      lg.style.width = lg.style.height = (h * 0.7) + 'px';
      if (v){ var im = el('img'); im.alt = ''; im.src = '/team_logo/' + encodeURIComponent(team) + '?v=' + v; lg.appendChild(im); }
      chip.appendChild(lg);
    }
    var txt = el('div', 'txt');
    var nm = el('div', 'nm', name || (team ? '' : '—'));
    nm.style.fontSize = (h * 0.40) + 'px';
    txt.appendChild(nm);
    var relay = legs.length > 0 || relayEvent || /\s[A-Z]$/.test(name);
    var subText = legs.length ? legs.join(' · ') : (relay ? '' : team);
    if (subText){
      var sub = el('div', 'sub' + (legs.length ? ' legs' : ' code mono'), subText);
      sub.style.fontSize = (h * (legs.length ? 0.22 : 0.25)) + 'px';
      if (legs.length) nm.style.fontSize = (h * 0.34) + 'px';
      txt.appendChild(sub);
    }
    chip.appendChild(txt);
    rail.appendChild(chip);
  });
  rail.querySelectorAll('.nm').forEach(function(e){ fit(e, 0.62); });
  rail.querySelectorAll('.sub:not(.legs)').forEach(function(e){ fit(e, 0.7); });
  // relay legs may take two lines; shrink only if they'd overflow the chip
  rail.querySelectorAll('.chip').forEach(function(ch){
    var t = ch.querySelector('.txt'), lg = ch.querySelector('.sub.legs'); if (!lg) return;
    var size = parseFloat(lg.style.fontSize), min = size * 0.75;
    while (t.scrollHeight > ch.clientHeight + 1 && size > min){ size -= 0.5; lg.style.fontSize = size + 'px'; }
  });
}

var socket = io.connect(location.protocol + '//' + location.host + '/scoreboard');
if (window.mbAutoReload) window.mbAutoReload(socket);
socket.on('update_scoreboard', function(u){ for (var k in u) s[k] = u[k]; render(); });
socket.on('disconnect', function(){ setTimeout(function(){ if (!socket.connected) rail.classList.add('off'); }, 5000); });
})();
</script>
</body>
</html>
