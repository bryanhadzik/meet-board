{# Tab bar shared by the admin pages. `active` = settings | music | colors | update #}
<style>
  .mbnav { display:flex; gap:2px; flex-wrap:wrap; align-items:flex-end; background:#0b1618; padding:10px 16px 0;
           font:600 14px/1 "Segoe UI", system-ui, sans-serif; position:sticky; top:0; z-index:50; }
  .mbnav .brand { color:#bfe6ec; margin-right:14px; padding-bottom:11px; letter-spacing:.04em; }
  .mbnav a { color:#9fb6bb; text-decoration:none; padding:10px 12px; border-radius:8px 8px 0 0; }
  .mbnav a:hover { color:#fff; background:#16282c; text-decoration:none; }
  .mbnav a.on { color:#0b1618; background:#f4f6f6; }
  .mbnav .sp { flex:1; }
  .mbnav a.ext { font-weight:500; font-size:13px; }
  .mbnav .rl { margin:0 0 6px 8px; font:600 12px/1 "Segoe UI", system-ui, sans-serif; color:#0b1618; background:#d9a441;
               border:0; border-radius:6px; padding:7px 10px; cursor:pointer; }
  .mbnav .rl.done { background:#7fe0ab; }
  @media (max-width:1340px) { .mbnav a.ext { display:none; } }
  @media (max-width:1180px) { .mbnav .brand { display:none; } .mbnav a { padding:10px 9px; } }
  .mbnav .bk { background:#2a3a3d; color:#e6eef0; }
  .mbnav .wu { background:#2a3a3d; color:#e6eef0; }
  .mbnav .wu.on { background:#3ddc84; color:#0b1618; }
  .mbnav .nt { background:#2a3a3d; color:#e6eef0; }
  .mbnav .nt.on { background:#ffd23f; color:#0b1618; }
  .mbnav .brk { background:#2a3a3d; color:#e6eef0; }
  .mbnav .brk.on { background:#ffd60a; color:#0b1618; }
  .mbnav a .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ddc84; margin-left:6px; vertical-align:2px; }
  .mbnav .bk.on { background:#000; color:#ffd479; box-shadow:0 0 0 1px #ffd479 inset; }
</style>
<nav class="mbnav">
  <span class="brand">meet-board</span>
  <a href="/settings" class="{{ 'on' if active == 'settings' else '' }}">Settings</a>
  <a href="/meet_files" class="{{ 'on' if active == 'files' else '' }}">Meet</a>
  <a href="/music" class="{{ 'on' if active == 'music' else '' }}">Music</a>
  <a href="/team_colors" class="{{ 'on' if active == 'colors' else '' }}">Team Colors</a>
  <a href="/state_times" class="{{ 'on' if active == 'state' else '' }}">State Times</a>
  <a href="/software_update" class="{{ 'on' if active == 'update' else '' }}" id="mbUpdTab" title="Software update">Update</a>
  <a href="/debug" class="{{ 'on' if active == 'debug' else '' }}">Debug</a>
  <span class="sp"></span>
  <a href="/web/meetboard" class="ext" target="_blank">Meet board &#8599;</a>
  <a href="/overlay/race?test" class="ext" target="_blank">Overlay &#8599;</a>
  <button class="rl" type="button" title="Reload every meet board, scoreboard and overlay page (TVs, OBS)"
    onclick="var b=this;fetch('/screens/reload?json=1',{method:'POST'}).then(function(){b.textContent='Screens refreshing\u2026';b.classList.add('done');setTimeout(function(){b.textContent='Refresh all screens';b.classList.remove('done');},4000);});">Refresh all screens</button>
  <button class="rl wu" id="mbWarmBtn" type="button" title="Show the warm-up slide (meet, teams, start time) on the meet boards and the stream">Warm-up slide</button>
  <button class="rl nt" id="mbNoticeBtn" type="button" title="Full-screen &quot;We need timers&quot; slide on the meet board TVs (change the words in Settings &gt; Screens)">Need timers</button>
  <button class="rl brk" id="mbBreakBtn" type="button" title="Break slide on the meet board TVs: team scores, results so far and the events still to come (Settings &gt; Screens: show it automatically after the session's last event)">Break slide</button>
  <button class="rl bk" id="mbBlackBtn" type="button" title="Blank the meet board and scoreboard TVs (the OBS overlay is not affected)">Go black</button>
</nav>
<script>
(function(){
  var b = document.getElementById('mbBlackBtn'), st = null;
  function show(d){
    st = d; if (window.bkShow) window.bkShow(d);
    b.classList.toggle('on', !!d.black);
    b.textContent = d.black ? (d.reason === 'auto' ? 'Screens black (idle) \u2014 wake' : 'Screens black \u2014 wake') : 'Go black';
    b.title = d.black ? 'TVs are black. Click to wake them.' :
      (d.auto && d.black_in_seconds != null ? 'Blank the TVs now. Otherwise they go black by themselves in ' +
        Math.ceil(d.black_in_seconds/60) + ' min with no meet activity.' : 'Blank the meet board and scoreboard TVs');
  }
  function load(){ fetch('/api/blackout',{cache:'no-store'}).then(function(r){return r.json();}).then(show).catch(function(){}); }
  b.onclick = function(){
    fetch('/api/blackout',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({black: !(st && st.black)})}).then(function(r){return r.json();}).then(show);
  };
  load(); setInterval(load, 15000);
  // warm-up slide toggle
  var w = document.getElementById('mbWarmBtn'), wOn = false;
  function wShow(d){ wOn = !!(d && d.on); w.classList.toggle('on', wOn);
    w.textContent = wOn ? 'Warm-up: ON' : 'Warm-up slide';
    if (window.wuShow) window.wuShow(d); }
  function wLoad(){ fetch('/api/warmup_slide',{cache:'no-store'}).then(function(r){return r.json();}).then(wShow).catch(function(){}); }
  w.onclick = function(){
    fetch('/api/warmup_slide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:!wOn})})
      .then(function(r){return r.json();}).then(wShow);
  };
  window.wuNavShow = wShow;
  // notice slide ("We need timers") toggle
  var nb = document.getElementById('mbNoticeBtn'), nOn = false;
  function nShow(d){ nOn = !!(d && d.on); nb.classList.toggle('on', nOn);
    nb.textContent = nOn ? 'Timers slide: ON' : 'Need timers';
    if (window.ntShow) window.ntShow(d); }
  nb.onclick = function(){
    fetch('/api/notice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:!nOn})})
      .then(function(r){return r.json();}).then(nShow);
  };
  window.ntNavShow = nShow;
  // break slide toggle
  var bb = document.getElementById('mbBreakBtn'), bOn = false;
  function bShow(d){ bOn = !!(d && d.on); bb.classList.toggle('on', bOn);
    bb.textContent = bOn ? 'Break slide: ON' : (d && d.pending ? 'Break slide soon\u2026' : 'Break slide');
    if (window.brShow) window.brShow(d); }
  bb.onclick = function(){
    fetch('/api/break_slide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:!bOn})})
      .then(function(r){return r.json();}).then(bShow);
  };
  window.brNavShow = bShow;
  function bLoad(){ fetch('/api/break_slide',{cache:'no-store'}).then(function(r){return r.json();}).then(bShow).catch(function(){}); }
  bLoad(); setInterval(bLoad, 15000);
  function nLoad(){ fetch('/api/notice',{cache:'no-store'}).then(function(r){return r.json();}).then(nShow).catch(function(){}); }
  nLoad(); setInterval(nLoad, 15000);
  wLoad(); setInterval(wLoad, 15000);
  // flag the Software Update tab when a newer release is out
  fetch('/update_check').then(function(r){ return r.json(); }).then(function(d){
    if (d && d.newer){ var t = document.getElementById('mbUpdTab');
      t.title = 'Update available: ' + d.latest; t.insertAdjacentHTML('beforeend', '<span class="dot"></span>'); }
  }).catch(function(){});
})();
</script>
