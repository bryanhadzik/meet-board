{# Top bar on the admin pages. `active` = settings | files | music | colors | state | update | debug #}
{# The shared top bar (static/appbar.js, same file as MeetDeck's). Its Screens menu has the TV controls. #}
<script>
window.APPBAR = {app: "meetboard", active: {{ (active if active in ('music', 'stream') else 'admin')|tojson }}, page: {{ active|tojson }},
                 debug: {{ (show_debug or active == 'debug')|tojson }}, streamOff: {{ streaming_off|tojson }}};
</script>
<script src="{{ url_for('static', filename='appbar.js') }}"></script>
<script>
(function(){
  // flag the Software Update tab when a newer release is out
  fetch('/update_check').then(function(r){ return r.json(); }).then(function(d){
    if (d && d.newer && window.AppBar) window.AppBar.update('Update available: ' + d.latest);
  }).catch(function(){});
})();
</script>
