<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Board</title>
<!--
  Spectator meet board for the lobby TVs. Left: the heat in the water (live
  from the CTS console). Right: the heat that swims next, from the loaded
  start lists only - it keeps working if the console link drops.
  Kiosk URL: http://<timing-pc>:5000/web/meetboard
  No external fonts or CDNs: the pool network may have no internet.
-->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; cursor:none; }
  .board {
    container-type:inline-size;
    width:min(100vw, 177.78vh); aspect-ratio:16/9;
    position:relative; overflow:hidden; background:#0b1618; color:#fff;
    font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column;
  }
  .mono { font-family:Consolas, "Cascadia Mono", "DejaVu Sans Mono", "Courier New", monospace; }

  .bhead { height:13%; background:#0a6b7c; display:flex; align-items:center; padding:0 1.6cqw; gap:1.4cqw; flex:0 0 auto; }
  .evno { font-size:3.1cqw; font-weight:800; letter-spacing:-.02em; line-height:1; }
  .evname { font-size:1.6cqw; font-weight:600; color:#c6e7ec; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55cqw; }
  .spacer { flex:1; }
  .heatof { font-size:2.3cqw; font-weight:700; color:#e3f4f7; letter-spacing:.06em; text-align:right; white-space:nowrap; }
  .clock { font-size:3.4cqw; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; text-align:right; min-width:14cqw; }

  .bbody { flex:1; display:flex; min-height:0; }
  /* 75 / 25: the heat in the water is the main event; up next is a sidebar */
  .colL { width:75%; display:flex; flex-direction:column; min-width:0; }
  .colR { width:25%; display:flex; flex-direction:column; min-width:0; background:#101f22; border-left:.25cqw solid #24393e; }
  .colR .ctitle { border-top:.35cqw solid #d9a441; padding-top:.7cqw; flex-direction:column; align-items:stretch; gap:.2cqw; padding-left:1.2cqw; padding-right:1.2cqw; }

  .ctitle { display:flex; align-items:baseline; gap:.9cqw; padding:.85cqw 1.6cqw .5cqw; }
  .ctitle .lbl { font-size:1.05cqw; letter-spacing:.18em; color:#77979e; white-space:nowrap; flex:0 0 auto; }
  .colR .ctitle .lbl { font-size:1.9cqw; font-weight:700; letter-spacing:.18em; color:#f0c96a; }
  .ctitle .sub { font-size:1.05cqw; color:#6f9099; margin-left:auto; letter-spacing:.08em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .colR .ctitle .sub { margin-left:0; font-size:1.5cqw; font-weight:600; color:#c6dade; letter-spacing:.04em; }
  .colR .ctitle .sub2 { font-size:1.15cqw; color:#6f9099; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub.warn { color:#f0a36a; }

  .rows { flex:1; display:flex; flex-direction:column; min-height:0; }
  .row { flex:1; display:flex; align-items:center; gap:1cqw; padding:0 1.8cqw 0 0; min-height:0; position:relative; }
  .row:nth-child(odd) { background:rgba(255,255,255,.035); }
  .stripe { width:.9cqw; align-self:stretch; flex:0 0 auto; background:var(--tc, transparent); }
  .ln { width:3cqw; text-align:center; font-size:2.1cqw; font-weight:600; color:#7d9aa1; flex:0 0 auto; }
  .nm { flex:1; font-size:2.6cqw; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .nm.empty { color:#3d575d; font-weight:400; }
  /* Relays: team + letter on top, the four legs' last names underneath */
  .nm.relay { display:flex; flex-direction:column; justify-content:center; line-height:1.08; align-self:stretch; }
  .nm.relay .nm1 { font-size:2.2cqw; overflow:hidden; text-overflow:ellipsis; }
  .nm .legs { font-size:1.35cqw; font-weight:500; opacity:.78; letter-spacing:0; overflow:hidden; text-overflow:ellipsis; }
  .tm { font-size:1.5cqw; font-weight:700; letter-spacing:.06em; flex:0 0 auto; width:8cqw; color:var(--tc, #7d9aa1); }
  .tmr { font-size:2.6cqw; font-variant-numeric:tabular-nums; text-align:right; width:13cqw; padding-right:.5cqw; flex:0 0 auto; color:#dfe9ea; }
  .pl { font-size:2.3cqw; font-weight:700; text-align:center; width:3cqw; flex:0 0 auto; color:#7d9aa1; }
  .row.lead .tmr, .row.lead .pl { color:#7fe0ab; }
  /* beat the seed time: seconds dropped, beside the finish time */
  .drop { flex:0 0 auto; width:7cqw; text-align:right; font-size:1.45cqw; font-weight:700; color:#7fe0ab; font-variant-numeric:tabular-nums; }
  .drop:empty { visibility:hidden; }
  .style-lanes .row.has-team .drop { color:var(--ink); }
  .style-light .drop { color:#127a3f; }

  .colR .row { gap:.6cqw; padding-right:1.1cqw; }
  .colR .stripe { width:.55cqw; }
  .colR .nm { font-size:1.4cqw; }
  .colR .nm.relay .nm1 { font-size:1.15cqw; }
  /* narrow sidebar: legs may wrap to a second line */
  .colR .nm .legs { font-size:.78cqw; white-space:normal; line-height:1.12; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .colR .ln { font-size:1.2cqw; width:1.9cqw; }
  .colR .tm { font-size:.95cqw; width:4.2cqw; text-align:right; }
  .colR .seed { font-size:1cqw; color:#6f9099; width:4.4cqw; text-align:right; flex:0 0 auto; }
  .noseed .seed { display:none; }

  .then { border-top:.2cqw solid #24393e; padding:.7cqw 1.2cqw; display:flex; align-items:baseline; gap:.6cqw; flex:0 0 auto; }
  .then .lbl { font-size:.85cqw; letter-spacing:.16em; color:#5d7d84; }
  .then .txt { font-size:1cqw; font-weight:600; color:#b7cace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .empty-panel { flex:1; display:flex; align-items:center; justify-content:center; color:#5d7d84; font-size:1.3cqw; text-align:center; padding:1.5cqw; }

  /* ================= styles (Settings > Team Colors, or ?style=) ================= */

  /* LANES: each occupied lane is filled with its team color */
  .style-lanes .rows { gap:.35cqw; padding:.2cqw 0; }
  .style-lanes .row:nth-child(odd) { background:transparent; }
  .style-lanes .row.has-team { background:var(--tc); color:var(--ink); }
  .style-lanes .row.has-team .ln,
  .style-lanes .row.has-team .tm,
  .style-lanes .row.has-team .tmr,
  .style-lanes .row.has-team .pl,
  .style-lanes .row.has-team .seed { color:var(--ink); }
  .style-lanes .row.has-team .ln { background:rgba(0,0,0,.16); align-self:stretch; display:flex; align-items:center; justify-content:center; }
  .style-lanes .row.lead .tmr, .style-lanes .row.lead .pl { color:var(--ink); }
  .style-lanes .row.lead { box-shadow:inset 0 0 0 .3cqw #ffffff, 0 0 1.2cqw rgba(255,255,255,.35); }
  .style-lanes .row.lead .pl::after { content:''; }
  .style-lanes .stripe { display:none; }
  .style-lanes .row:not(.has-team) { background:rgba(255,255,255,.03); }

  /* POOL: blue water, lane ropes between rows, team shown as a chip */
  .style-pool .board { background:linear-gradient(180deg,#0d4f7a 0%,#0a3d63 100%); }
  .style-pool .colR { background:rgba(4,30,52,.55); border-left-color:#0b2e4a; }
  .style-pool .row:nth-child(odd) { background:transparent; }
  .style-pool .rows .row + .row::before {
    content:''; position:absolute; left:0; right:0; top:-.2cqw; height:.4cqw;
    background:repeating-linear-gradient(90deg,#e53935 0 1.6cqw,#ffffff 1.6cqw 3.2cqw,#1e5bd8 3.2cqw 4.8cqw,#ffffff 4.8cqw 6.4cqw);
    opacity:.85; border-radius:.2cqw;
  }
  .style-pool .stripe { display:none; }
  .style-pool .ln { color:#cfe6f5; }
  .style-pool .tm { background:var(--tc); color:var(--ink); border-radius:.5cqw; text-align:center; padding:.25cqw 0; }
  .style-pool .row:not(.has-team) .tm { background:transparent; }
  .style-pool .ctitle .lbl, .style-pool .ctitle .sub { color:#bfe0f5; }
  .style-pool .nm.empty { color:#3f7aa3; }

  /* LIGHT: for bright rooms / glare. Team colors become chips so pale tints still read */
  .style-light .board { background:#f4f6f7; color:#10202a; }
  .style-light .bhead { background:#0a6b7c; color:#fff; }
  .style-light .colR { background:#e6ecee; border-left-color:#c9d4d7; }
  .style-light .row:nth-child(odd) { background:rgba(0,0,0,.04); }
  .style-light .ln { color:#51666d; }
  .style-light .nm.empty { color:#b3c1c5; }
  .style-light .tmr { color:#10202a; }
  .style-light .pl { color:#51666d; }
  .style-light .row.lead .tmr, .style-light .row.lead .pl { color:#127a3f; }
  .style-light .tm { background:var(--tc); color:var(--ink); border-radius:.5cqw; text-align:center; padding:.25cqw 0; }
  .style-light .row:not(.has-team) .tm { background:transparent; }
  .style-light .stripe { width:1.2cqw; }
  .style-light .ctitle .lbl { color:#51666d; }
  .style-light .colR .ctitle .lbl { color:#9a6b12; }
  .style-light .ctitle .sub, .style-light .colR .ctitle .sub { color:#51666d; }
  .style-light .then { border-top-color:#c9d4d7; } .style-light .then .txt { color:#10202a; }

  .bfoot { height:10%; background:#8a6620; display:flex; align-items:center; padding:0 1.6cqw; gap:1.6cqw; flex:0 0 auto; }
  .bfoot .meet { font-size:1.45cqw; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bfoot .sc { margin-left:auto; display:flex; align-items:center; gap:1.4cqw; }
  .scitem { display:flex; align-items:center; gap:.5cqw; }
  .scdot { width:1cqw; height:1cqw; flex:0 0 auto; }
  .scab { font-size:1.15cqw; font-weight:600; color:#f6e6c4; letter-spacing:.05em; }
  .scpt { font-size:1.7cqw; font-weight:700; font-variant-numeric:tabular-nums; }
  .link { font-size:.9cqw; letter-spacing:.14em; color:#f6e6c4; border:.12cqw solid rgba(255,255,255,.45); padding:.25cqw .6cqw; display:none; }
  .link.on { display:block; }
</style>
</head>
<body>
<div class="board" id="bd">
  <div class="bhead">
    <div style="min-width:0">
      <div class="evno" id="evno">MEET BOARD</div>
      <div class="evname" id="evname"></div>
    </div>
    <div class="spacer"></div>
    <div>
      <div class="heatof mono" id="heatof"></div>
      <div class="clock mono" id="clock"></div>
    </div>
  </div>

  <div class="bbody">
    <div class="colL">
      <div class="ctitle"><span class="lbl mono">IN THE WATER</span><span class="sub mono" id="subL"></span></div>
      <div class="rows" id="rowsL"></div>
    </div>
    <div class="colR" id="colR">
      <div class="ctitle"><span class="lbl mono">UP NEXT</span><span class="sub mono" id="subR"></span><span class="sub2 mono" id="subR2"></span></div>
      <div class="rows" id="rowsR"></div>
      <div class="then" id="then"><span class="lbl mono">THEN</span><span class="txt" id="thenTxt"></span></div>
    </div>
  </div>

  <div class="bfoot">
    <div class="link mono" id="link">RECONNECTING</div>
    <div class="meet" id="meetName">{{ meet_title }}</div>
    <div class="sc" id="scores"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='socket.io.4.8.3.min.js') }}"></script>
<script>
(function(){
"use strict";
var TEAM_TAGS = {{ team_tags | tojson }};   // [[score_key, team_code], ...]
var s = {};                                   // merged server state
var COLOR = {};
var colorKey = '';

/* ---------- OKLab distance for the team-color collision rule ---------- */
function lin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
function oklab(hex){
  var r=lin(parseInt(hex.slice(1,3),16)), g=lin(parseInt(hex.slice(3,5),16)), b=lin(parseInt(hex.slice(5,7),16));
  var l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),
      m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),
      q=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*q,
          1.9779984951*l-2.4285922050*m+0.4505937099*q,
          0.0259040371*l+0.7827717662*m-0.8086757660*q];
}
function dE(a,b){ var A=oklab(a),B=oklab(b); return 100*Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]); }
var MIN_SEP = 15;

/* Home team keeps its primary. Any team too close to an already-assigned
   color falls back to its alternate if that clears; otherwise the primary
   stands and the abbreviation beside every stripe carries identity. */
function assignColors(){
  var tc = s.team_colors || {}, codes = (s.meet_teams || []).slice();
  Object.keys(tc).forEach(function(c){ if(codes.indexOf(c) < 0) codes.push(c); });
  var key = JSON.stringify([tc, codes, s.home_team]);
  if (key === colorKey) return;
  colorKey = key; COLOR = {};
  var home = s.home_team;
  if (home && codes.indexOf(home) > 0){ codes.splice(codes.indexOf(home),1); codes.unshift(home); }
  var taken = [];
  // Only teams actually in the meet compete for separation
  var inMeet = {}; (s.meet_teams || []).forEach(function(c){ inMeet[c] = 1; });
  codes.forEach(function(code){
    var t = tc[code]; if(!t || !/^#[0-9a-f]{6}$/i.test(t.color||'')) return;
    var pick = t.color;
    if (inMeet[code]) {
      var clash = taken.some(function(c){ return dE(c, t.color) < MIN_SEP; });
      if (clash && /^#[0-9a-f]{6}$/i.test(t.alt||'')){
        if (taken.every(function(c){ return dE(c, t.alt) >= MIN_SEP; })) pick = t.alt;
      } else if (clash && t.auto){
        // Nobody chose this color: take the palette entry farthest from everything assigned
        var best = pick, bestD = -1;
        (s.color_palette || []).forEach(function(c){
          var d = Math.min.apply(null, taken.map(function(x){ return dE(x, c); }));
          if (d > bestD){ bestD = d; best = c; }
        });
        pick = best;
      }
      taken.push(pick);
    }
    COLOR[code] = pick;
  });
}
function colorOf(team){ return COLOR[team] || '#7d9aa1'; }
// Dark or light text on a team-colored background, whichever reads better
function inkOf(hex){
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return '#ffffff';
  var L = 0.2126*lin(parseInt(hex.slice(1,3),16)) + 0.7152*lin(parseInt(hex.slice(3,5),16)) + 0.0722*lin(parseInt(hex.slice(5,7),16));
  return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? '#0b1618' : '#ffffff';
}
function paint(row, team){
  if (!team) return;
  var c = colorOf(team);
  row.classList.add('has-team');
  row.style.setProperty('--tc', c);
  row.style.setProperty('--ink', inkOf(c));
}

var STYLES = ['classic', 'lanes', 'pool', 'light'];
var URL_STYLE = (new URLSearchParams(location.search).get('style') || '').toLowerCase();
function applyStyle(){
  var st = STYLES.indexOf(URL_STYLE) >= 0 ? URL_STYLE : (s.board_style || 'classic');
  if (STYLES.indexOf(st) < 0) st = 'classic';
  var cls = 'style-' + st;
  if (document.body.className !== cls) document.body.className = cls;
}

// Name cell; relays get their legs' last names on a second, smaller line
function nameCell(name, team, legs){
  legs = (legs || []).filter(function(x){ return trim(x); });
  if (!legs.length) return el('div', 'nm' + (name ? '' : ' empty'), name || (team ? '' : '\u2014'));
  var d = el('div', 'nm relay');
  d.appendChild(el('div', 'nm1', name));
  d.appendChild(el('div', 'legs', legs.join(' \u00b7 ')));
  return d;
}
// "Beat the seed": finished time under the entry seed time -> seconds dropped
function secs(v){
  var m = String(v == null ? '' : v).trim().match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  return m ? (m[1] ? +m[1] * 60 : 0) + parseFloat(m[2]) : NaN;
}
function dropOf(time, seed){
  if (s.show_pr_tags === false) return '';
  var t = secs(time), sd = Number(seed);
  if (!(t > 0) || !(sd > 0) || t >= sd) return '';
  return '\u2212' + (sd - t).toFixed(2);
}
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function trim(v){ return (v == null ? '' : String(v)).trim(); }
function fmtSeed(v){
  if (v === '' || v == null) return '';
  var t = Number(v); if (!isFinite(t) || t <= 0) return String(v);
  var m = Math.floor(t/60), sec = t - m*60;
  return m ? m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(2) : sec.toFixed(2);
}
function numLanes(){
  // Configured pool width, stretched if either heat has swimmers past it
  var n = parseInt(s.num_lanes || {{ num_lanes }}, 10) || 8;
  for (var i = 10; i > n; i--) if (trim(s['lane_name'+i]) || trim(s['lane_team'+i])) { n = i; break; }
  (s.next_lanes || []).forEach(function(l){ if ((l.name || l.team) && l.lane > n) n = l.lane; });
  return Math.max(1, Math.min(10, n));
}

function renderHeader(){
  var ev = trim(s.current_event), ht = trim(s.current_heat);
  var hasEvent = ev && ev !== '0';
  document.getElementById('evno').textContent = hasEvent ? 'EVENT ' + ev : 'MEET BOARD';
  document.getElementById('evname').textContent = hasEvent ? trim(s.event_name).toUpperCase() : '';
  var hc = parseInt(s.heat_count, 10) || 0;
  document.getElementById('heatof').textContent = hasEvent && ht ? 'HEAT ' + ht + (hc ? ' OF ' + hc : '') : '';
  document.getElementById('clock').textContent = trim(s.running_time);
  if (s.meet_title != null) document.getElementById('meetName').textContent = s.meet_title;
}

function stateLabel(){
  var st = s.race_state || '';
  if (st === 'Running') return 'RACING';
  if (st === 'Finished') return 'RESULTS';
  if (/PreRace$/.test(st)) return 'ON THE BLOCKS';
  return '';
}

function renderCurrent(){
  var box = document.getElementById('rowsL'); box.textContent = '';
  var sub = document.getElementById('subL');
  sub.textContent = connected ? stateLabel() : 'RECONNECTING';
  sub.className = 'sub mono' + (connected ? '' : ' warn');
  var n = numLanes();
  for (var i = 1; i <= n; i++){
    var name = trim(s['lane_name'+i]), team = trim(s['lane_team'+i]);
    var running = !!s['lane_running'+i];
    var t = running ? '' : trim(s['lane_time'+i]);
    var place = trim(s['lane_place'+i]);
    var r = el('div', 'row' + (place === '1' && t ? ' lead' : ''));
    paint(r, team);
    r.appendChild(el('div','stripe'));
    r.appendChild(el('div','ln mono', String(i)));
    r.appendChild(nameCell(name, team, s['lane_legs'+i]));
    r.appendChild(el('div','tm mono', team));
    r.appendChild(el('div','drop mono', t ? dropOf(t, s['lane_seed_time'+i]) : ''));
    r.appendChild(el('div','tmr mono', t));
    r.appendChild(el('div','pl mono', t ? place : ''));
    box.appendChild(r);
  }
}

function renderNext(){
  var col = document.getElementById('colR');
  var box = document.getElementById('rowsR'); box.textContent = '';
  var lanes = s.next_lanes || [];
  var subR = document.getElementById('subR');
  if (!lanes.length){
    subR.textContent = ''; document.getElementById('subR2').textContent = '';
    var msg = s.schedule_has_names === false || !s.meet_teams || !s.meet_teams.length
      ? 'Waiting for start lists'
      : (s.current_in_schedule === false ? 'Event ' + trim(s.current_event) + ' is not in the loaded start lists'
                                         : 'Last heat of the session');
    box.appendChild(el('div','empty-panel', msg));
    document.getElementById('then').style.display = 'none';
    return;
  }
  var nhc = parseInt(s.next_heat_count, 10) || 0;
  var sameEvent = String(s.next_event) === trim(s.current_event);
  subR.textContent = 'EVENT ' + s.next_event + ' · HEAT ' + s.next_heat + (nhc ? ' OF ' + nhc : '');
  // New event coming: name it, since the header still shows the current one
  document.getElementById('subR2').textContent = sameEvent ? '' : trim(s.next_event_name).toUpperCase();
  var anySeed = lanes.some(function(l){ return l.seed !== '' && l.seed != null; });
  col.classList.toggle('noseed', !anySeed);
  var n = numLanes();
  lanes.slice(0, n).forEach(function(l){
    var r = el('div','row');
    paint(r, l.team);
    r.appendChild(el('div','stripe'));
    r.appendChild(el('div','ln mono', String(l.lane)));
    r.appendChild(nameCell(l.name, l.team, l.legs));
    r.appendChild(el('div','tm mono', l.team || ''));
    r.appendChild(el('div','seed mono', fmtSeed(l.seed)));
    box.appendChild(r);
  });
  var then = document.getElementById('then');
  if (s.then_event !== '' && s.then_event != null){
    then.style.display = '';
    document.getElementById('thenTxt').textContent =
      'EV ' + s.then_event + ' · HEAT ' + s.then_heat +
      (String(s.then_event) !== String(s.next_event) ? ' · ' + trim(s.then_event_name).toUpperCase() : '');
  } else {
    then.style.display = 'none';
  }
}

function renderScores(){
  var sc = document.getElementById('scores'); sc.textContent = '';
  TEAM_TAGS.forEach(function(pair){
    var pts = trim(s[pair[0]]), code = pair[1];
    if (!pts || !code) return;
    var it = el('div','scitem');
    var d = el('div','scdot'); d.style.background = colorOf(code); it.appendChild(d);
    it.appendChild(el('div','scab mono', code));
    it.appendChild(el('div','scpt mono', pts));
    sc.appendChild(it);
  });
}

var pending = false;
function render(){
  if (pending) return; pending = true;
  requestAnimationFrame(function(){
    pending = false;
    applyStyle(); assignColors(); renderHeader(); renderCurrent(); renderNext(); renderScores();
    document.getElementById('link').classList.toggle('on', !connected);
  });
}

var connected = false;
var socket = io.connect(location.protocol + '//' + location.host + '/scoreboard');
socket.on('connect', function(){ connected = true; render(); });
socket.on('disconnect', function(){ connected = false; render(); });
socket.on('update_scoreboard', function(u){
  for (var k in u) s[k] = u[k];
  render();
});
render();

// socket.io reconnects on its own; never reload (a failed reload leaves an error page on the TV).
})();
</script>
</body>
</html>
